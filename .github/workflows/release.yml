name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  get-next-version:
    uses: semantic-release-action/next-release-version/.github/workflows/next-release-version.yml@3afa0258b980a53b23f8e18a388981dff12d8888 # v4

  build-and-release:
    name: Release
    runs-on: ubuntu-latest
    needs: get-next-version
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: needs.get-next-version.outputs.new-release-published == 'true'
    strategy:
      matrix:
        target:
            - x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Install semantic-release-cargo
        run: cargo install --locked semantic-release-cargo@2.4.84

      - name: Install cargo-deb
        run: cargo install --locked cargo-deb@3.8.0

      - name: Prepare semantic-release for Rust
        run: semantic-release-cargo prepare ${{ needs.get-next-version.outputs.new-release-version }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build package
        run: cargo deb --target ${{ matrix.target }}

      - name: Create dist directory
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/blob dist/blob-${{ matrix.target }}
          cp target/${{ matrix.target }}/debian/*.deb dist/

      - name: Create binary checksum
        run: |
          shasum --algorithm 256 --binary *.deb blob-${{ matrix.target }} | tee SHA256SUMS.txt
        working-directory: ./dist

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"
      - run: npm ci
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.PUBLISH_SECRET }}
